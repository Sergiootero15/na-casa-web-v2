<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contacta con NA CASA.">
  <title>Contacto | NA CASA</title>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container nav-wrapper">
            <a href="index.html" class="logo">
        <img src="img/NA CASA LOGO_LOGO POSITIVO.png" alt="NA CASA" class="logo-img">
      </a>
      <nav class="main-nav">
        <a href="index.html">Inicio</a>
        <a href="servicios.html">Servicios</a>
        <a href="sobre-mi.html">Sobre mí</a>
        <a href="recursos.html">Recursos</a>
        <a href="contacto.html" class="btn btn-small">Contacto</a>
      </nav>
    </div>
  </header>

  <main class="page-main">
    <section class="section">
      <div class="container narrow">
        <p class="eyebrow">Contacto</p>
        <h1>Hablemos</h1>
        <p class="lead">Página lista para poner un formulario, email, teléfono o botón de WhatsApp.</p>

        <form class="contact-form">
          <label>
            Nombre
            <input type="text" name="name" placeholder="Tu nombre">
          </label>
          <label>
            Email
            <input type="email" name="email" placeholder="tu@email.com">
          </label>
          <label>
            Mensaje
            <textarea name="message" rows="6" placeholder="Cuéntame en qué necesitas ayuda"></textarea>
          </label>
          <button type="submit" class="btn">Enviar</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-grid">
      <div><strong>NA CASA</strong></div>
      <div><a href="index.html">Inicio</a></div>
    </div>
  </footer>

  <script src="assets/js/main.js"></script>
</body>
</html>
